[project]
name = "opendam-preview-engine"
version = "0.1.0"
description = "Preview worker for formats the OpenDAM desktop app can't decode in Rust"
requires-python = ">=3.14"
dependencies = [
  "Pillow>=10.4.0",
  "numpy>=1.26",
  "olefile>=0.46", # .max embedded thumbnail extraction
  "trimesh>=4.4.0", # OBJ/STL/PLY/glTF loading and GLB export
  "pycollada>=0.8", # trimesh .dae loader
  "assimp-py>=1.0.7", # FBX/3DS import (imported as assimp_py)
  "rhino3dm>=8.0.0", # .3dm
  "pypdfium2>=4.30.0", # .ai (PDF-compatible) previews
  "imageio>=2.34", # HDR reader
  "openexr-numpy>=0.0.6", # EXR reader
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff"]

# worker.py is a script, not an installable package.
[tool.uv]
package = false

# Tests import worker.py from this folder.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["opendam_preview"]
