name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  # No paths filter: "Lint, check and build" is a required check, and a
  # workflow skipped by a filter leaves it pending, which blocks the merge.
  # The changes job skips the work for docs-only pull requests instead.
  pull_request:
    branches: [main]

# Cancel superseded workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # A job skipped by its `if` passes a required check, so a pull request that
  # changes only the files push's paths-ignore lists (keep the two in step)
  # can merge without a build. The other jobs skip only on an explicit
  # `false`: if this job fails, they still run.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its parents
      - name: Look for changes outside docs
        id: filter
        shell: bash
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames lists both paths, so moving code into docs/ counts
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
            cat "$RUNNER_TEMP/changed-files"
            code=false
            while IFS= read -r file; do
              case "$file" in
                *.md | docs/* | .gitignore | LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Every make target spans TypeScript, Rust and Python, so splitting them
  # would install the toolchains and compile Tauri repeatedly. Tests get their
  # own job: they compile a separate (test) profile anyway, so it runs in parallel.
  checks:
    name: Lint, check and build
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # "packageManager"
      # uv installs the Python version in packages/preview-engine/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/preview-engine/uv.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - run: make deps
      # make check also verifies the Tauri crate and npm package versions match:
      # tauri build refuses mismatched minor versions.
      - run: make check
      - run: make lint
      - run: make build

  test:
    name: Test
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The second line is what the Blender tarball links that the first doesn't promise
      - name: Install Tauri and Blender system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libvulkan1 libx11-6 libxrender1 libxfixes3 libxi6 libxkbcommon0
      # The Blender-backed Rust tests run the pinned Blender (.github/blender.env), and fail
      # without it under CI. Not apt's: Ubuntu's Blender is older than the series exports accept.
      - name: Read the pinned Blender
        run: grep -E '^BLENDER_(VERSION|SHA256)=' .github/blender.env >> "$GITHUB_ENV"
      # Restored and saved apart, so a failing test doesn't stop the download being cached
      - name: Restore Blender
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/opendam-blender
          key: blender-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_SHA256 }}
      - name: Install Blender
        run: |
          blender=$(scripts/install-blender.sh ~/.cache/opendam-blender)
          echo "OPENDAM_BLENDER=$blender" >> "$GITHUB_ENV"
      - name: Cache Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/opendam-blender
          key: ${{ steps.blender-cache.outputs.cache-primary-key }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/preview-engine/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148 # keep in step with mise.toml
      - run: make deps
      # The same runs as `make test`, split so a failed TypeScript test file is
      # rerun once. bun runs from the repo root so its JUnit names repo-relative
      # files, which the rerun passes back to bun. nextest's JUnit names no file,
      # so Rust failures are not rerun.
      - name: Test (TypeScript)
        id: test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/flake"
          set +e
          bun test ./apps/desktop --reporter=junit --reporter-outfile="$RUNNER_TEMP/flake/junit.xml"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
      - name: Rerun failed test files once
        uses: ./.github/actions/mission-flake-report
        with:
          mode: rerun
          job: test (bun)
          junit: ${{ runner.temp }}/flake/junit.xml
          exit-code: ${{ steps.test.outputs.exit-code }}
          rerun-command: bun test {files} --reporter=junit --reporter-outfile={junit}
          report: ${{ runner.temp }}/flake/report.json
      # The bun step always succeeds under set +e, so its success means setup
      # did not fail: these two still run after a failed rerun, but not after
      # a failed install.
      - name: Upload flake report
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: flake-report-bun
          path: ${{ runner.temp }}/flake/report.json
      - name: Test (Rust)
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        working-directory: apps/desktop/src-tauri
        run: cargo nextest run --locked --profile ci
      - name: Test (Python)
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        working-directory: packages/preview-engine
        run: uv run --frozen pytest

  # Publishes the "Flaky tests" check and keeps one issue per flaky test.
  flake-report:
    name: Flake report
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Download flake reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: flake-report-*
          path: flake-reports
      - name: Publish flake report
        uses: ./.github/actions/mission-flake-report
        with:
          mode: publish
          reports: flake-reports
          report: flake-report.json
