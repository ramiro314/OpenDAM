[package]
name = "opendam-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "opendam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opendam-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", features = ["jpeg", "png", "tiff", "bmp", "gif", "tga", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
# API keys in the Secret Service, through zbus (no libdbus)
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# AI tagging requests over HTTPS, with rustls on the ring provider sqlx already uses
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
tauri-plugin-notification = "2"
# Game export: validates bundles against the pinned asset contract, offline (no remote $ref)
jsonschema = { version = "0.60", default-features = false }
# Source and bundle file hashes (plan game-export A4)
sha2 = "0.11"
# Joins a Check's FBX fact reads, so they reach the preview worker together (already in the tree)
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# A temporary folder per Blender job, for its script, job and result (plan game-export A2)
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
toml = "0.8"
tokio = { version = "1", features = ["test-util"] }
